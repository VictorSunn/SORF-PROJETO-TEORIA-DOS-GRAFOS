<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SORF - Rotas Urbanas</title>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <section class="hero">
            <img id="logoSorf" src="../assets/LogoSorf.png" alt="Logo SORF" class="logo-sorf" style="max-width: 250px; height: auto; display: block; margin: 0 auto; transition: transform 0.1s ease-out;">          
            <h2>Sistema de Otimização de Rotas Urbanas</h2>
            <p>
                Rede urbana baseada em grafos ponderados com cálculo de menor rota pelo algoritmo de Dijkstra.
            </p>
        </section>

        <section class="layout">

            <section class="panel">
                <div class="panel-header">
                    <h3>Calcular rota</h3>
                    <span>Ferraz de Vasconcelos</span>
                </div>

                <label for="origin">Local de origem</label>
                <select id="origin"></select>

                <label for="destination">Local de destino</label>
                <select id="destination"></select>

                <button onclick="calculateRoute()">Calcular menor rota</button>

                <div id="result" class="result">
                    Selecione uma origem e um destino.
                </div>
            </section>

            <section class="map-panel">
                <div id="map"></div>
            </section>

        </section>

    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>

    <script>
        document.addEventListener('mousemove', function(e) {
            const logo = document.getElementById('logoSorf');
            if (logo) {
                // Calcula a distância do mouse até o centro da tela.
                // O número 30 define a "força" do movimento. 
                // Se quiser que ela se mova mais, diminua o número (ex: 15).
                // Se quiser que se mova menos, aumente o número (ex: 50).
                const x = (window.innerWidth / 2 - e.pageX) / 30; 
                const y = (window.innerHeight / 2 - e.pageY) / 30;

                // Move a logo na direção oposta ao mouse
                logo.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>
</body>
</html>
